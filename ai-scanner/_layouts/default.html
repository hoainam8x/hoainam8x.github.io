<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0a84ff">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo title=false %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📄</text></svg>">
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-name">Duna AI Scan</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
        <a href="{{ '/support/' | relative_url }}">Support</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ 'now' | date: '%Y' }} Duna Labs · Made in Vietnam · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      <p class="muted">Bundle ID: <code>com.duna.scanner</code> · iOS 17+ · <a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/terms/' | relative_url }}">Terms</a> · <a href="{{ '/support/' | relative_url }}">Support</a></p>
    </div>
  </footer>
</body>
</html>
